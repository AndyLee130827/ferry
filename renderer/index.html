<!DOCTYPE html>
<html lang="zh-CN" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';">
  <title>Ferry</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="sb-drag">Ferry</div>
      <div class="sb-search">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
          <path d="M7.2 11.4a4.2 4.2 0 1 0 0-8.4 4.2 4.2 0 0 0 0 8.4ZM10.4 10.4 13.4 13.4"/>
        </svg>
        <input id="hostSearch" placeholder="搜索主机" spellcheck="false">
      </div>
      <div class="sb-list" id="hostList"></div>
      <div class="sb-foot" id="sidebarFoot"></div>
    </aside>

    <section class="main">
      <div class="topbar" id="topbar"></div>
      <div class="panes">
        <div id="paneLocal"></div>
        <div class="gutter" id="gutter"></div>
        <div id="paneRemote"></div>
      </div>
      <div id="queueMount"></div>
    </section>
  </div>

  <div id="toasts"></div>

  <script src="js/util.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pane.js"></script>
  <script src="js/hosts.js"></script>
  <script src="js/queue.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
